<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trang đăng ký tài khoản ShopVN">
  <title>ShopVN – Đăng ký tài khoản</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-card">
    <h1>Đăng ký tài khoản mới</h1>

    <form action="xu_ly_dangky.php" method="POST" enctype="multipart/form-data" name="formDangKy" id="formDangKy">

      <fieldset>
        <legend>Thông tin cơ bản</legend>

        <div class="form-row">
          <label for="hoten">Họ và tên: <span class="required">*</span></label>
          <div class="field">
            <input type="text" id="hoten" name="hoten" placeholder="Nguyễn Văn An" required>
          </div>
        </div>

        <div class="form-row">
          <label for="email">Email: <span class="required">*</span></label>
          <div class="field">
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
          </div>
        </div>

        <div class="form-row">
          <label for="matkhau">Mật khẩu: <span class="required">*</span></label>
          <div class="field">
            <input type="password" id="matkhau" name="matkhau" placeholder="Tối thiểu 8 ký tự" minlength="8" required>
          </div>
        </div>

        <div class="form-row">
          <label for="sdt">Số điện thoại:</label>
          <div class="field">
            <input type="tel" id="sdt" name="sdt" placeholder="0901234567" pattern="0[0-9]{9}" title="Số điện thoại gồm 10 số, bắt đầu bằng 0">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Thông tin cá nhân</legend>

        <div class="form-row">
          <label for="tuoi">Tuổi:</label>
          <div class="field">
            <input type="number" id="tuoi" name="tuoi" min="16" max="100" step="1" value="18">
          </div>
        </div>

        <div class="form-row">
          <label for="ngaysinh">Ngày sinh:</label>
          <div class="field">
            <input type="date" id="ngaysinh" name="ngaysinh" value="2005-01-01">
          </div>
        </div>

        <div class="form-row">
          <label id="gioitinh-label">Giới tính:</label>
          <div class="field radio-group" role="group" aria-labelledby="gioitinh-label">
            <label><input type="radio" name="gioitinh" value="nam"> Nam</label>
            <label><input type="radio" name="gioitinh" value="nu" checked> Nữ</label>
            <label><input type="radio" name="gioitinh" value="khac"> Khác</label>
          </div>
        </div>

        <div class="form-row">
          <label for="mausac">Màu yêu thích:</label>
          <div class="field">
            <input type="color" id="mausac" name="mausac" value="#e07856">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Sở thích &amp; Cài đặt</legend>

        <div class="form-row">
          <label for="timkiem">Tìm kiếm sở thích:</label>
          <div class="field">
            <input type="search" id="timkiem" name="timkiem" placeholder="Ví dụ: đọc sách, chơi game...">
          </div>
        </div>

        <div class="form-row">
          <label for="chitieu">Mức chi tiêu/tháng (VNĐ):</label>
          <div class="field">
            <output id="chitieu-value" for="chitieu">5.000.000</output>
            <input type="range" id="chitieu" name="chitieu" min="500000" max="20000000" step="500000" value="5000000"
                   oninput="document.getElementById('chitieu-value').value = Number(this.value).toLocaleString('vi-VN')">
          </div>
        </div>

        <div class="form-row">
          <label id="sothich-label">Sở thích (chọn nhiều):</label>
          <div class="field checkbox-group" role="group" aria-labelledby="sothich-label">
            <label><input type="checkbox" name="sothich[]" value="docsach" checked> Đọc sách</label>
            <label><input type="checkbox" name="sothich[]" value="choigame"> Chơi game</label>
            <label><input type="checkbox" name="sothich[]" value="dulich" checked> Du lịch</label>
          </div>
        </div>

        <div class="form-row">
          <label for="website">Website cá nhân:</label>
          <div class="field">
            <input type="url" id="website" name="website" placeholder="https://example.com">
          </div>
        </div>

        <div class="form-row">
          <label for="anhdaidien">Ảnh đại diện:</label>
          <div class="field">
            <input type="file" id="anhdaidien" name="anhdaidien" accept="image/*">
          </div>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit">Đăng ký ngay</button>
        <button type="reset">Nhập lại</button>
      </div>

    </form>
  </div>

</body>
</html>
